<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b0b">
  <meta name="description" content="张军毅的完整照片索引。">
  <title>光迹索引 — Zhang Junyi</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="archive-page">
  <div class="page-noise" aria-hidden="true"></div>

  <header class="archive-page-header">
    <a class="brand" href="index.html" aria-label="返回张军毅作品集首页">
      <span class="brand-mark">ZJ</span>
      <span class="brand-name">张军毅<small>Visual Artist &amp; Photographer</small></span>
    </a>
    <a class="archive-back" href="index.html">← Back to index</a>

  <button class="archive-return" id="archive-return" type="button">
    <span aria-hidden="true">←</span>

    </div>

    <div class="full-archive-grid">
      <figure class="full-archive-card">
        <img src="assets/photos/photo-01.jpg" alt="驻足" width="1200" height="1600" loading="lazy">
        <figcaption><strong>驻足</strong><small>Landscape / 2025</small></figcaption>

        <figcaption><strong>海平线之外</strong><small>Sea / 2024</small></figcaption>
      </figure>
      <figure class="full-archive-card">
        <img src="assets/photos/photo-13.jpg" alt="绿色" width="1400" height="1800" loading="lazy">
        <figcaption><strong>绿色</strong><small>Portrait / 2026</small></figcaption>

        <figcaption><strong>移动的窗</strong><small>Night / 2023</small></figcaption>
      </figure>

        <img src="assets/photos/photo-07.jpg" alt="绿色沉默" width="1800" height="1200" loading="lazy">

      </figure>
      <figure class="full-archive-card">
        <img src="assets/photos/photo-09.jpg" alt="无人的房间" width="1800" height="1200" loading="lazy">
        <figcaption><strong>无人的房间</strong><small>Interior / 2024</small></figcaption>
      </figure>
      <figure class="full-archive-card">

        <figcaption><strong>等待</strong><small>Interior / 2024</small></figcaption>
      </figure>
    </div>
  </main>
  <script>
    (() => {
      const backButton = document.getElementById("archive-return");
      if (!backButton) return;

      backButton.addEventListener("click", () => {
        if (document.referrer && window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html";
        }
      });
    })();
  </script>
</body>
</html>
